# Deployt den Cloudflare Worker bei jeder Änderung unter worker/ und spielt das Schema nach (wiederholbar).
# Benötigt die Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID (SETUP.md).
# Läuft erst, nachdem «Setup worker» einmal durchgelaufen ist (database_id in wrangler.toml); vorher übersprungen.
name: Deploy worker
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Einrichtung prüfen
        id: check
        working-directory: worker
        run: |
          if grep -qE 'database_id = ""' wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Noch nicht eingerichtet – zuerst Actions → «Setup worker» → Run workflow. Dieser Lauf wird übersprungen."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Schema nachziehen und deployen
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npx wrangler d1 execute krt2 --remote --yes --file=schema.sql
          npx wrangler deploy
